name: TopTiroir
options:
  bundleIdPrefix: local.toptiroir
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  TopTiroir:
    type: application
    platform: macOS
    sources: [TopTiroir]
    info:
      path: TopTiroir/Info.plist
      properties:
        CFBundleDisplayName: TopTiroir
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.toptiroir.app
        PRODUCT_NAME: TopTiroir
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TopTiroirTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TopTiroirTests
      - path: TopTiroir/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.toptiroir.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TopTiroir:
    build:
      targets:
        TopTiroir: all
        TopTiroirTests: [test]
    test:
      targets: [TopTiroirTests]
