name: TopTiroir
options:
  bundleIdPrefix: local.toptiroir
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # Apple Silicon 맥만 쓰므로 arm64만(앱 크기 절반)
    ARCHS: arm64
    MARKETING_VERSION: 0.9.0
    CURRENT_PROJECT_VERSION: 12
targets:
  TopTiroir:
    type: application
    platform: macOS
    sources: [TopTiroir]
    info:
      path: TopTiroir/Info.plist
      properties:
        CFBundleDisplayName: TopTiroir
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: local.toptiroir.favorite
            UTTypeDescription: TopTiroir 즐겨찾기 줄
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: local.toptiroir.todo
            UTTypeDescription: TopTiroir 할 일 줄
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.toptiroir.app
        PRODUCT_NAME: TopTiroir
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  TopTiroirTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TopTiroirTests
      - path: TopTiroir/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.toptiroir.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TopTiroir:
    build:
      targets:
        TopTiroir: all
        TopTiroirTests: [test]
    test:
      targets: [TopTiroirTests]
